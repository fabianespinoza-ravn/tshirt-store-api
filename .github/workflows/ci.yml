name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run: what matters is
# the verdict on the latest commit, not on the intermediate ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # `prisma generate` requires DATABASE_URL to resolve, even though it
      # never opens the connection. The unit tests run against the Prisma
      # mock, so this job doesn't need a real database. The day the e2e tests
      # land, they go in a separate job with `services: postgres`.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The generated client isn't versioned, and nothing compiles without it.
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      # `lint` locally runs with --fix; in CI it only checks, it doesn't fix.
      - name: Lint
        run: npm run lint:ci

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test -- --ci --coverage

      - name: Build
        run: npm run build
