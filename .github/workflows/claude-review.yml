name: Claude review

on:
  pull_request:
    # `reopened` and `ready_for_review` are here because both produce a pull
    # request that is ready to merge and carries no review: a branch closed
    # and reopened, or a draft marked ready, fires neither `opened` nor
    # `synchronize`, so without them the check simply never runs and the
    # pull request shows no review rather than a failed one.
    types: [opened, synchronize, reopened, ready_for_review]

# It only comments. It never writes to the branch, so there are no commits
# of its own in the history: `contents` is read-only on purpose.
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest

    # Without this the check can be satisfied by a comment it did not cause.
    # Two runs on the same pull request read the same count before either
    # posts; the one that reviews raises it, and the one that stayed silent
    # then sees a number that grew and passes — the exact hole this job was
    # added to close, surviving inside the fix. Queued rather than cancelled:
    # a cancelled run's comments would land inside another run's window and
    # bring the race back in a narrower form.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # This workflow is the only one that handles a credential, so its
      # actions are pinned to the commit and not to a moving tag: whoever
      # controls what `v1` points to would control the token. The SHAs are
      # what's behind checkout@v7 and claude-code-action@v1 today.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The review action refuses to exchange its token against a version of
      # this file that differs from main's, and reports that refusal as a
      # green check with no comment. Five of the first eleven pull requests
      # merged that way without a review. Fail here first, with the reason
      # on the check, so a change to this file is read by a person before it
      # lands — and keep such changes in their own pull request.
      #
      # The scripts are covered for a second and sharper reason: everything
      # under `.github/scripts/` is executed later in this job **with
      # `GH_TOKEN` set**, from the pull request's own checkout.
      # `count-review-comments` is run by name, so a pull request free to
      # edit it could make the counter report whatever it liked — passing the
      # very gate that exists to demand a review — or use the job's token for
      # something else entirely. Guarding only the workflow file left the
      # script it calls wide open, which is a hole this job created rather
      # than closed.
      - name: Refuse to pass silently when this workflow or its scripts change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Fetched first, filtered second. With the call inside the same
          # substitution as the `|| true`, a `gh` that could not answer
          # produced an empty list and the guard passed — a dead API call
          # disarming the check, which is the third time on this branch that
          # a failure has reported success. The assignment fails the step
          # under `set -e`; only the grep, whose empty result is a legitimate
          # answer, is allowed to return non-zero.
          changed="$(
            gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate --jq '.[].filename'
          )"
          protected="$(
            printf '%s\n' "${changed}" \
            | grep -E '^\.github/(workflows/claude-review\.yml|scripts/)' || true
          )"
          if [ -n "${protected}" ]; then
            echo "::error::This pull request changes the review workflow or a script this job runs with a token, so the action would skip the review and still pass. Review the change by hand before merging: ${protected}"
            exit 1
          fi

      # Counted before and after, so the step below can tell a review that
      # ran from one that did not. Only this author's comments are counted,
      # which is why a human or another bot commenting mid-run cannot
      # satisfy it.
      - name: Count the review's comments before it runs
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
        # Assigned first, written second. `echo "count=$(...)"` exits zero
        # even when the substitution inside it failed, so a counter that
        # could not reach the API would write an empty value and the step
        # would pass — and the failure would surface later as a comparison
        # against an empty string, blaming the wrong thing.
        run: |
          count="$(node ./.github/scripts/count-review-comments.mjs)"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844 # v1
        with:
          # Subscription token, not an API key: reviews aren't billed
          # separately. Renew it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The branch is already checked out.

            This is a NestJS + Prisma REST API. Weigh these above style:

            - Authorization. Every CASL rule and guard change: can a CLIENT
              reach another user's row? Read `docs/AUTHORIZATION-MATRIX.md`
              before judging a rule: it lists every operation of the contract
              with the role that may call it.
            - Error handling. Unhandled errors must not leak their message to
              the client; the problem-details filter is the only place that
              shapes a response.
            - Money and stock. Order state transitions, payment webhooks and
              stock movements. Ask, in this order: are the stock reservation
              and the order row written in one transaction, or can a crash
              between them oversell? Does every failure path release what it
              reserved, or only the happy one? Is a repeated webhook delivery
              a no-op — Stripe retries the delivery, so what a careless
              handler duplicates is a payment row or a transition, not the
              charge — and is the check against the Stripe identifier in the
              same write as the effect? Are the counters `reserved`,
              `usageReserved` and `usageCount` moved atomically rather than
              read in one statement and written in the next? Is every amount
              an integer number of cents? A cancellation that does not free
              `reserved` is the same bug as an oversell, arriving later.
              `.claude/agents/money-and-stock.md` holds the long form, the
              schema's pending constraints included.
            - Data exposure. No secret, token or connection string in code,
              logs or fixtures.
            - Tests. New behaviour without a test is a finding.
            - Docs. When the diff changes a directory layout, a script, an
              environment variable or a command that `README.md` or `docs/`
              describes, the sentence that now lies is a finding.

            Report only what you would block a merge on. When nothing blocks
            the merge, post a single top-level comment of one line saying you
            reviewed the diff and found nothing blocking — no list, no praise —
            so a review that ran is distinguishable from one that was skipped.
            Noise on every pull request is how a reviewer gets ignored.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for specific lines.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # The failure this exists for is not the action erroring — that already
      # turns the check red. It is the action exiting successfully having
      # posted nothing, which is indistinguishable from a clean review and is
      # what a green check is then taken to mean. Seven of the first twenty
      # pull requests with a green review here had no comment from it at all.
      #
      # The prompt already requires one line when nothing blocks the merge,
      # precisely so the two cases can be told apart. This step is what makes
      # that requirement enforced rather than requested.
      # No `if:` on purpose. The default is `success()`, which is exactly
      # right: when the guard or the action itself fails the job is already
      # red for a reason of its own, and running this would relabel it as
      # "the review said nothing" — a different diagnosis and a wrong one.
      - name: Fail when the review said nothing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          after="$(node ./.github/scripts/count-review-comments.mjs)"
          if [ "$after" -le "${{ steps.before.outputs.count }}" ]; then
            echo "::error::The review finished without posting a comment, so nothing distinguishes it from a review that never ran. Re-run the job; if it passes silently again, the action is refusing to review and the pull request has not been reviewed."
            exit 1
          fi
          echo "The review posted $((after - ${{ steps.before.outputs.count }})) comment(s)."
