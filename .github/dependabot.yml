version: 2

updates:
  # Las dependencias de la aplicación. Agrupadas para que una semana normal sea
  # un solo PR de parches y no quince.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
      prisma:
        patterns:
          - prisma
          - '@prisma/*'
      types:
        patterns:
          - '@types/*'
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Los majors no entran solos. NestJS 12 y Prisma 7 en plena semana 4 son un
    # refactor, no una actualización: se deciden a mano cuando la entrega esté
    # cerrada. Los parches y minors siguen llegando, que es donde viven los
    # arreglos de seguridad.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

    commit-message:
      prefix: chore
      include: scope

  # Las propias acciones del pipeline envejecen igual que el código.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
