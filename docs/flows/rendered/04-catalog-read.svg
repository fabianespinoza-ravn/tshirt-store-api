="577.58" y2="633" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/><text x="294.94" y="645" font-size="11" fill="#000000" xml:space="preserve" style="white-space: pre" font-weight="bold" font-family="sans-serif">[Public or customer]</text><polygon points="316.94,667 306.94,671 316.94,675 312.94,671" fill="#181818" stroke="#181818" stroke-width="1"/><line x1="310.94" y1="671" x2="555.58" y2="671" stroke="#181818" stroke-width="1" stroke-dasharray="2,2"/><text x="322.94" y="666" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-weight="bold" font-family="sans-serif">11</text><text x="340.68" y="666" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">200 Product </text><text x="414.39" y="666" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-weight="bold" font-family="sans-serif">without stock</text><path d="M430.30,712 L430.30,812 L816.30,812 L816.30,722 L806.30,712 L430.30,712" fill="#FFE0E0" stroke="#181818" stroke-width="0.50"/><path d="M806.30,712 L806.30,722 L816.30,722 L806.30,712" fill="#FFE0E0" stroke="#181818" stroke-width="0.50"/><text x="436.30" y="729" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">The contract declares the two shapes with </text><text x="682.71" y="729" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-weight="bold" font-family="sans-serif">anyOf</text><text x="719.55" y="729" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">, and anyOf</text><text x="436.30" y="744" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">validates if </text><text x="501.33" y="744" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-weight="bold" font-family="sans-serif">any</text><text x="523.73" y="744" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> branch validates. A manager response missing</text><text x="436.30" y="759" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">a field falls through the public branch, and a customer response</text><text x="436.30" y="774" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">that includes stock also passes. The contract can't detect it in</text><text x="436.30" y="789" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">either direction: that's why the tests assert the </text><text x="703.25" y="789" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-weight="bold" font-family="sans-serif">exact</text><text x="736.50" y="789" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> set</text><text x="436.30" y="804" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">of keys, not the absence of three fields.</text><polygon points="293.94,834 303.94,838 293.94,842 297.94,838" fill="#181818" stroke="#181818" stroke-width="1"/><line x1="168.07" y1="838" x2="299.94" y2="838" stroke="#181818" stroke-width="1"/><text x="175.07" y="833" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-weight="bold" font-family="sans-serif">12</text><text x="193.53" y="833" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">Opens the panel</text><polygon points="549.58,878 559.58,882 549.58,886 553.58,882" fill="#181818" stroke="#181818" stroke-width="1"/><line x1="305.94" y1="882" x2="555.58" y2="882" stroke="#181818" stroke-width="1"/><text x="312.94" y="869.50" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-weight="bold" font-family="sans-serif">13</text><text x="331.40" y="862" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">GET /products</text><text x="331.40" y="877" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">Authorization: manager Bearer</text><polygon points="316.94,907 306.94,911 316.94,915 312.94,911" fill="#181818" stroke="#181818" stroke-width="1"/><line x1="310.94" y1="911" x2="560.58" y2="911" stroke="#181818" stroke-width="1" stroke-dasharray="2,2"/><text x="322.94" y="906" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-weight="bold" font-family="sans-serif">14</text><text x="341.40" y="906" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">200 with stock and disabled products</text><?plantuml-src TLJ1RXen4BtlLqpf8TAA9BJDAHAjbb2YL2MXIj9USXbs1t1Zx9NjXQG_rdk_hCzUGY1D9H2iP-Rjp7jl_2OiP2bKQrOc2ofeeJCEhEsStf6TqGVwyvicpLIhafnmvObDHSvgEPoobufgPtzA6PGr6JV1ccOv5PVvUsLgThn4aQ-jyJ8Mxtak0z5sNJXdrnHS8rd6PR2EEj-LL_4FFcNZWrsAwn1xkdrA6BD1UNiuFiy07bIfQZQ1EYDdJH1JfU1eFtOfFdovfc9oaQ95Lc6ys3fr9jQ7kPFhRrzJQ3Z8idwVlYeVb9bxwlUpMphyI2CwfQjQZ2TmHUZDIJQAWGA1yyytT5noaBbrIdnMnC1mWCZPtk46vtslzw8M_5LD6VodcT91NCjlpNDbE95gR11oQhu8KOw8yKE5XMq25Gr-dVgLyb9l3iUoORpQjCjBwTwPAVA1H6lKRi-fJBI5dQOBABaIUcfgltEQj6r9DNcAHy9k05T9OAMxgVa87npNaS3NPps-64PPrGfOK8HreA4LRmu2oGFeZovGdYhbUQhXiHcU8sh9MiDSHCzjdVHEwDA6aMrCbOc6hD59g49Mn3rB9H6DQTbQ295TX3ZOnboRiIZF4q-GkhpFS-GduCqMx3Zq5QHzY2ZJ3afi4TzATePF-jeLUYowKOEtivdqf8Vqo6jKo24R19UQeMpBxjgINt2DnzHedhDvl9hbUIj0UW30YhM2sv6bPcrEdjFKiIaNpx4Z3B0XPhkhj5JUOmSYXpHJeY41U8mlXyNchOFgbeuMR_FYBJDRA4241GTIfjHDXLOI7P36MxZS-zZ0tg0bHnl0JxXKICN2o1oc16YbN7lLd2RG0uo_U6mPmPP3Ok2va0xoN1u0Xu6z121WT-xbqNVJ5iG4ddenfSG0fX9fv_H7KQ6OXAjfVFxl-kDI4VqVMz-PlPKytV8w44ZdNYpJiyKITrkpRtVlBm00?></g></svg>