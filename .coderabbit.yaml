# Automatic review is on: every pull request is read without being asked.
#
# What it costs is a rate limit, not money. The Open Source plan scales with
# the repository's stars and this one has zero, so it allows roughly one
# review per hour. A pull request pushed to three times in quick succession
# will have the later pushes skipped, and the review that matters is the one
# on the final diff — so batch the pushes rather than expecting each to be
# read. `@coderabbitai review` still forces one by hand when a skipped push
# was the important one.
language: en-US

# The schema rejects this field above 250 characters, and a rejected file
# applies nothing: automatic review would stay on.
tone_instructions: >-
  Weigh authorization, error handling, money and stock above style. For CASL or
  guard changes, ask whether a CLIENT reaches another user's row and check
  docs/AUTHORIZATION-MATRIX.md. New behaviour without a test is a finding.

reviews:
  # `assertive` instead of the `chill` default: the point is for it to find
  # things, not to play it safe.
  profile: assertive
  high_level_summary: true
  auto_review:
    enabled: true
    # A draft is work in progress by definition, and reviewing one spends an
    # hour's allowance on a diff its author has not finished.
    drafts: false
