# Automatic review is off on purpose. The Open Source plan scales the limit
# with the repository's stars, and this one has zero: it gets one review per
# hour. Spending it on a package-lock.json bump is wasting it, so it's
# requested by hand with `@coderabbitai review` on the pull request that
# earns it.
language: en-US

# The schema rejects this field above 250 characters, and a rejected file
# applies nothing: automatic review would stay on.
tone_instructions: >-
  Weigh authorization, error handling, money and stock above style. For CASL or
  guard changes, ask whether a CLIENT reaches another user's row and check
  docs/AUTHORIZATION-MATRIX.md. New behaviour without a test is a finding.

reviews:
  # `assertive` instead of the `chill` default: with only one review per
  # hour, the point is for it to find things, not to play it safe.
  profile: assertive
  high_level_summary: true
  auto_review:
    enabled: false
    drafts: false
