name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run: what matters is
# the verdict on the latest commit, not on the intermediate ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # `prisma generate` requires DATABASE_URL to resolve, even though it
      # never opens the connection. The unit tests run against the Prisma
      # mock, so this job doesn't need a real database; the e2e job below
      # is the one that does.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The generated client isn't versioned, and nothing compiles without it.
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      # `lint` locally runs with --fix; in CI it only checks, it doesn't fix.
      - name: Lint
        run: npm run lint:ci

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test -- --ci --coverage

      - name: Build
        run: npm run build

      # `start:prod` and both `dockerCommand` entries in render.yaml run
      # `node dist/main`. A build can succeed while emitting the entrypoint
      # somewhere else (widening tsconfig's `include` past src/ once moved it
      # to dist/src/main.js), so the path is checked explicitly.
      # Both entrypoints, for the same reason: render.yaml runs
      # `node dist/main` for the web service and `node dist/worker` for the
      # worker, and a build can succeed while emitting either one somewhere
      # else.
      - name: Production entrypoints
        run: test -f dist/main.js && test -f dist/worker.js

  # Real HTTP requests against the real application over a real Postgres.
  # Its own job so a failing flow reads as "the flow broke", not as a red
  # unit run, and so `verify` keeps needing no database at all.
  e2e:
    runs-on: ubuntu-latest

    services:
      # BullMQ connects at boot from block 4 on, so the suite no longer runs
      # without Redis. The port is the usual one here and 6380 locally,
      # because docker-compose.yml publishes it shifted — test/support/e2e-redis.ts
      # is what reconciles the two.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tshirt_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite's global setup syncs this database to schema.prisma with
      # the same plan-refuse-apply step a deploy runs, then truncates every
      # table before each test. DATABASE_URL only lets `prisma generate`
      # resolve; test/support/env.ts overwrites it in the test process.
      E2E_REDIS_HOST: localhost
      E2E_REDIS_PORT: 6379
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/tshirt_store_test?schema=public
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tshirt_store_test?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: End-to-end tests
        run: npm run test:e2e -- --ci

  # The compiled pre-deploy path, run the way a deploy runs it. `verify` and
  # `e2e` both reach `prisma/sync-schema.ts` through `prisma:sync`, which is
  # `ts-node` on the runner with the repository checked out and every
  # devDependency installed. `render.yaml` runs `prisma:sync:prod` instead:
  # plain `node` over `dist-deploy/`, inside the production image, where
  # ts-node is absent, the working directory is /app, only `prisma/schema.prisma`
  # was copied in and the Prisma CLI has to resolve out of the production
  # tree. Nothing proved that path — the image build only checks that the two
  # compiled files exist and that `prisma --version` resolves — so its first
  # real execution would have been Render's pre-deploy against the live
  # database. This job moves that first execution into a pull request.
  #
  # It builds an image, which is minutes `verify` and `e2e` do not spend, so
  # it is a job of its own rather than a step bolted onto either.
  prod-sync-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        # Throwaway values for a container that lives for the length of one
        # job and is published only on the runner's loopback. They are the
        # e2e job's on purpose: nothing here is a secret, and no real
        # credential is ever written into this file.
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tshirt_store_sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      IMAGE: tshirt-store-api:prod-sync-smoke
      # A service container publishes its port on the runner, not on the
      # bridge network a plain `docker run` joins, so `localhost` inside the
      # image would be the image itself and the connection would be refused.
      # Every `docker run` below passes `--network host`, which puts the
      # container in the runner's own network namespace; `localhost:5432` is
      # then the same address the runner uses, and the step receives what
      # Render also gives it — a DATABASE_URL in the environment, read by
      # schema.prisma's env("DATABASE_URL") and never handled by the script.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tshirt_store_sync?schema=public

    steps:
      - uses: actions/checkout@v7

      - name: Build the production image
        run: docker build --tag "$IMAGE" .

      # Exactly render.yaml's `preDeployCommand`, against an empty database:
      # the plan is the whole schema, so this asserts the step applied
      # something rather than finding nothing to do.
      - name: Pre-deploy step against an empty database
        shell: bash
        run: |
          docker run --rm --network host --env DATABASE_URL "$IMAGE" \
            npm run prisma:sync:prod 2>&1 | tee first-run.log
          grep -q 'sync-schema: applied\.' first-run.log

      # A pre-deploy step is re-run whenever a deploy is retried, so the
      # second run has to find nothing to do. If it plans SQL again, the
      # first run did not converge and every deploy would rewrite the schema.
      - name: The same step again is a no-op
        shell: bash
        run: |
          docker run --rm --network host --env DATABASE_URL "$IMAGE" \
            npm run prisma:sync:prod 2>&1 | tee second-run.log
          grep -q 'sync-schema: the database already matches schema\.prisma\.' second-run.log

      # The case this job exists to catch, asserted rather than assumed. A
      # column the datamodel does not declare makes the next plan a
      # DROP COLUMN, the first entry on sync-schema.ts's refusal list: the
      # run has to fail, and it has to fail by naming what it refused.
      - name: A plan the step refuses fails the job
        shell: bash
        run: |
          docker run --rm --interactive --network host --env DATABASE_URL "$IMAGE" \
            node node_modules/prisma/build/index.js db execute \
              --schema prisma/schema.prisma --stdin \
            <<< 'ALTER TABLE users ADD COLUMN prod_sync_smoke text;'

          if docker run --rm --network host --env DATABASE_URL "$IMAGE" \
               npm run prisma:sync:prod > refusal.log 2>&1; then
            echo 'sync-schema applied a plan it was supposed to refuse.'
            cat refusal.log
            exit 1
          fi
          cat refusal.log
          grep -q 'the plan contains DROP COLUMN' refusal.log
