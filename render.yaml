# Render blueprint. Matches the deployment section of docs/ARQUITECTURA.md:
# one container image, two processes under different entrypoints, and a
# schema sync (prisma/sync-schema.ts) as a pre-deploy step that runs once,
# never on boot.
#
# The image is ./Dockerfile. It ships both bootstrap files — dist/main for
# this file's web service and dist/worker for its worker — and the Dockerfile
# asserts both paths exist before the image is finished, because a build that
# emits an entrypoint somewhere else produces a deploy that builds cleanly and
# never starts.

databases:
  - name: tshirt-store-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: '17'

envVarGroups:
  - name: tshirt-store-config
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tshirt-store-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: tshirt-store-redis
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: tshirt-store-redis
          type: keyvalue
          property: port
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

services:
  - type: web
    name: tshirt-store-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node dist/main
    # Runs once, before the rollout replaces instances. Never on boot, so
    # instances never race to sync the schema — see the Deployment section
    # of docs/ARQUITECTURA.md. No migration history is kept: the step plans
    # the SQL from schema.prisma with `prisma migrate diff`, refuses a plan
    # that drops or narrows anything unless ALLOW_DESTRUCTIVE_SCHEMA_CHANGE=1
    # is set in the environment for that one deploy, and applies it as one
    # transaction with `prisma db execute` — see prisma/sync-schema.ts. It
    # never prompts, so it never needs `--accept-data-loss`. The backfill
    # after it fills the live_email/live_user_id columns on rows that predate
    # them — see prisma/backfill-live-columns.ts.
    # `prisma:sync:prod` and not `prisma:sync`: the latter runs both scripts
    # through `ts-node`, which is a devDependency and so is absent from the
    # image this command runs inside. The Dockerfile compiles the two scripts
    # to dist-deploy/ instead, and this runs them with plain `node`. The
    # Prisma CLI they drive is present because @prisma/client declares it as
    # a peer dependency, which puts it in the production tree. This exact
    # command is run inside this exact image, against a disposable database,
    # by the `prod-sync-smoke` job in .github/workflows/ci.yml, so a deploy is
    # not the first thing to execute it.
    # Schema and the code that reads it shipped together this once: nothing
    # was deployed yet to expand around — see the Deployment section.
    preDeployCommand: npm run prisma:sync:prod
    envVars:
      - fromGroup: tshirt-store-config

  - type: worker
    name: tshirt-store-worker
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker
    envVars:
      - fromGroup: tshirt-store-config

  - type: keyvalue
    name: tshirt-store-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []
