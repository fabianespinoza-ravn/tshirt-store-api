name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre la misma rama cancela la ejecución anterior: lo que
# importa es el veredicto sobre el último commit, no sobre los intermedios.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # `prisma generate` exige que DATABASE_URL resuelva, aunque nunca abra la
      # conexión. Los tests unitarios corren contra el mock de Prisma, así que
      # este job no necesita una base de datos de verdad. El día que entren los
      # e2e, van en un job aparte con `services: postgres`.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # El cliente generado no se versiona, y sin él no compila nada.
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      # `lint` local lleva --fix; en CI se comprueba, no se corrige.
      - name: Lint
        run: npm run lint:ci

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test -- --ci --coverage

      - name: Build
        run: npm run build
