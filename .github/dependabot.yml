version: 2

updates:
  # The application's dependencies. Grouped so a normal week is one patch PR
  # and not fifteen.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
      prisma:
        patterns:
          - prisma
          - '@prisma/*'
      types:
        patterns:
          - '@types/*'
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Majors don't land on their own. NestJS 12 and Prisma 7 in the middle of
    # week 4 are a refactor, not an update: they get decided by hand once the
    # submission is closed. Patches and minors keep coming through, which is
    # where the security fixes live.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

    commit-message:
      prefix: chore
      include: scope

  # The pipeline's own actions age just like the code does.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
